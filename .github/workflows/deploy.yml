name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prism-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 2m
          command_timeout: 15m
          # false: drone-ssh joins lines with && when script_stop is true,
          # which breaks multiline if/then scripts.
          script_stop: false
          script: |
            set -euo pipefail
            export PATH="/usr/local/bin:/usr/bin:$PATH"
            echo "[deploy] user=$(whoami) host=$(hostname)"
            ls -la /var/www
            if [ -d /var/www/lillyput/.git ] || [ -f /var/www/lillyput/deploy/deploy.sh ]; then
              APP_DIR=/var/www/lillyput
            elif [ -d /var/www/prism/.git ] || [ -f /var/www/prism/deploy/deploy.sh ]; then
              APP_DIR=/var/www/prism
            else
              echo "[deploy] FATAL: no checkout at /var/www/lillyput or /var/www/prism"
              exit 1
            fi
            echo "[deploy] using $APP_DIR"
            GIT_TERMINAL_PROMPT=0 git -C "$APP_DIR" fetch origin main || git -C "$APP_DIR" remote set-url origin https://github.com/gaurang-py/prism.git
            GIT_TERMINAL_PROMPT=0 git -C "$APP_DIR" fetch origin main
            git -C "$APP_DIR" reset --hard origin/main
            bash "$APP_DIR/deploy/deploy.sh"
